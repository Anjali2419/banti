body {
    font-family: Arial, sans-serif;
    background: #f0f4f8;
}

.container {
    width: 320px;
    margin: 100px auto;
    padding: 25px;
    background: white;
    border-radius: 10px;
    text-align: center;
}

input, button {
    box-sizing: border-box;
    width: 100%;
    padding: 12px;
    margin: 10px 0;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    cursor: pointer;
}
